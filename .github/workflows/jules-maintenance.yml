name: background maintenance

# Scheduled secondary maintenance for allowlisted PUBLIC repositories.
#
# It picks one repository, looks for one objectively justified piece of work,
# and hands exactly that to Jules. Finding nothing is a successful run.
#
# This repository is the orchestrator. It is public on purpose: Actions minutes
# are free for public repositories, and nothing here is secret - the only
# credential is the JULES_API_KEY repository secret, which never reaches a log.
#
# Nothing here merges anything. Jules opens a pull request on the target repo
# and it waits for review.

on:
  schedule:
    # Daily, 06:17 UTC, working through up to MAX_REPOS_PER_RUN repositories.
    # The odd minute avoids the top-of-hour queue where GitHub delays scheduled
    # runs most.
    #
    # Quota was never the binding limit: the Google AI Pro allowance is 100 tasks
    # per rolling 24h and this spends a handful a week. The binding limit is how
    # many pull requests a human can actually read, so the brake lives in
    # triage.py as MAX_OPEN_MAINTENANCE_PRS - above that backlog a run does
    # nothing at all. The cadence can be generous precisely because the queue
    # depth is bounded rather than the frequency.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Force one allowlisted repo (owner/name). Empty = rotation picks.'
        required: false
      task:
        description: 'Manual task text. Empty = normal triage. Still passes every gate.'
        required: false
      dry_run:
        description: 'Triage only, never contact Jules'
        type: boolean
        default: true

# Least privilege, and both of these are scoped to THIS repository only - the
# default token cannot write to a target repo, which is why Jules (not this
# workflow) is what opens a pull request there.
#   contents: write - commits maintenance/state.json back so rotation survives
#     across runs, and keeps this repository active enough that GitHub does not
#     auto-disable the schedule after 60 idle days.
#   issues: write   - opens the approval queue item when the sensitivity gate
#     holds a piece of work. Without it a refusal is silent, which is how the
#     only person who could approve it never learns it exists.
permissions:
  contents: write
  issues: write

# One maintenance run at a time, globally. A queued second run would race the
# state file and could double-delegate the same repository.
concurrency:
  group: background-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout orchestrator
        # Pinned by SHA: a moving tag on a third-party action is a supply-chain
        # hole even when the publisher is trustworthy. This is actions/checkout v4.2.2.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Verify the guard rails before trusting them
        # If a rule that decides what may be delegated is broken, the run stops
        # here. A maintenance system that cannot prove its own guard rails has no
        # business creating tasks.
        #   test_gate   - what counts as too sensitive to delegate
        #   test_triage - whose issue text may become an agent brief, and the
        #                 review-backlog brake that bounds the queue
        run: |
          set -euo pipefail
          python3 maintenance/tests/test_gate.py
          python3 maintenance/tests/test_triage.py

      - name: Triage and delegate
        id: run
        env:
          # Default token. Only ever used to READ public repositories and to push
          # the state file back here - never to write to a target repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read-only fine-grained PAT covering the PRIVATE product repositories
          # (lucky-cat, nock). The default token above cannot see them at all, and
          # a 404 from an invisible repository is indistinguishable from "nothing
          # to do" - so without this secret they are dropped by name, loudly,
          # rather than quietly triaged as empty. Contents/Issues/Actions: read.
          # Nothing here ever needs write on a target repo: Jules opens the pull
          # request through its own GitHub App.
          MAINTENANCE_READ_TOKEN: ${{ secrets.MAINTENANCE_READ_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          MAINTENANCE_RESULT: ${{ github.workspace }}/maintenance-run.json
          # Every dispatch input reaches the shell through the environment, never
          # through ${{ }} interpolation inside the script. Interpolated input is
          # how a workflow turns a text box into arbitrary shell.
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_REPO: ${{ inputs.repo }}
          IN_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          args=()
          # Scheduled runs have no inputs at all; those must be live, not dry.
          if [ "${IN_DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          if [ -n "${IN_REPO:-}" ]; then args+=(--repo "$IN_REPO"); fi
          if [ -n "${IN_TASK:-}" ]; then args+=(--task "$IN_TASK"); fi
          python3 maintenance/triage.py "${args[@]}"

      - name: Publish run record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintenance-run
          path: maintenance-run.json
          if-no-files-found: warn
          retention-days: 90

      - name: Persist rotation state
        if: always()
        run: |
          set -euo pipefail
          # `git add` FIRST. On the very first run state.json is untracked, and
          # `git diff --quiet` reports no change for an untracked path - so the
          # file was never committed, every run started from empty state, and
          # rotation kept re-picking priority 1. Staging first makes the check
          # see creations as well as edits.
          #
          # repos.json is staged too: family discovery appends newly created Lucky
          # Cat repositories to the allowlist, and an addition that is not
          # committed would be rediscovered and re-announced on every single run.
          git add maintenance/state.json maintenance/repos.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name  "background-maintenance"
          git config user.email "background-maintenance@users.noreply.github.com"
          git commit -m "chore(maintenance): record run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
