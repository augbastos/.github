name: Bug report
description: Something behaves differently from what it says it does
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
      placeholder: I ran X, expected Y, got Z.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >
        The smallest sequence that shows the problem. A minimal reproduction is the
        single most useful thing in this form.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, or the commit SHA if you are running from source.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      description: Name and major version is enough - "Windows 11", "Ubuntu 24.04", "macOS 15".
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste the full error, not a screenshot of part of it. Redact anything secret.
      render: shell
